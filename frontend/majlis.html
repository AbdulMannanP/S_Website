<!DOCTYPE html>

  <link rel="stylesheet" href="/dist/output.css?v=7">
  
  <style>

  <script>
    (function() {
      var storedLang = localStorage.getItem('saeed_lang') || 'en';
      document.documentElement.lang = storedLang;
      document.documentElement.dir = storedLang === 'ar' ? 'rtl' : 'ltr';
      window.saeedInitialLang = storedLang;

  <style>
    body.modal-active .floating-whatsapp, body.modal-active [class*="animate-pulse-ring"] { display: none !important; }
